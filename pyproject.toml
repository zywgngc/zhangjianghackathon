[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhangjiang-game-harness"
version = "0.1.0"
description = "Chinese HTML game generation harness with grounded web asset retrieval"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "openai>=1.60,<3",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "playwright>=1.49,<2",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
images = ["Pillow>=10.4,<12"]
research = ["jsonschema[format-nongpl]>=4.18,<5"]

[project.scripts]
game-asset-agent = "asset_agent.cli:main"

[tool.setuptools.packages.find]
include = ["game_harness*", "asset_agent*"]

[tool.setuptools.package-data]
game_harness = ["static/*", "knowledge/*.md"]
asset_agent = ["specs/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
