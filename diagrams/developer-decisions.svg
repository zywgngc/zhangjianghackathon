<title id="developer-decisions-title">Developer choices during generation</title><desc id="developer-decisions-desc">When existing preferences cannot resolve a choice, save a multiple-choice decision card. Independent work continues. The developer chooses an option or custom answer, which is checked against the current revision. A compatible answer is committed and dependent work resumes; a stale answer causes the question to be refreshed.</desc>
