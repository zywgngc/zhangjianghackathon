<title id="system-architecture-title">System architecture</title><desc id="system-architecture-desc">Developer inputs and WebMCP tools enter the same project API. The orchestrator schedules the designer, builder, and QA workflow. QA defects return to the builder; passing checks create a versioned preview. Unresolved choices return to the developer.</desc>
