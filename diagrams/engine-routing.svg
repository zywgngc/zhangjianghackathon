<title id="engine-routing-title">Engine routing</title><desc id="engine-routing-desc">A game brief and effective preferences feed the engine router. Interface-heavy games use HTML/CSS and React, 2D sprite games use Phaser, and 3D scene games use Babylon.js. Each route feeds a selected engine adapter, then the shared build and test lifecycle.</desc>
